    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      /* Ocultar barra/drawer de Netlify para evitar que tape el botón de WhatsApp */
      netlify-drawer,
      #netlify-drawer,
      [data-netlify-drawer],
      div[data-netlify-drawer],
      iframe[id*="netlify"],
      iframe[src*="netlify"],
      .netlify-drawer,
      .netlify-feedback-badge,
      #netlify-collaborative-tools,
      div[class*="netlify-drawer"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        z-index: -99999 !important;
        width: 0 !important;
        height: 0 !important;
        transform: translateY(2000px) !important;
      }
    </style>
